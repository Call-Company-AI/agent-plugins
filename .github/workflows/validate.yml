name: Validate plugin packages
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python3 scripts/package.py --check
      - run: python3 scripts/package.py
      - name: Check reproducible packages
        run: |
          python3 scripts/package.py --out /tmp/callcompany-packages
          cmp dist/callcompany-chatgpt.zip /tmp/callcompany-packages/callcompany-chatgpt.zip
          cmp dist/callcompany-claude.zip /tmp/callcompany-packages/callcompany-claude.zip
